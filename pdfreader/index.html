<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn PDF Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>PDF Reader</h1>
        <input type="file" id="file-selector" accept=".pdf">
        
        <div id="navigation">
            <button id="prev-page">Vorige</button>
            <span>Pagina: <span id="page-num">0</span> / <span id="page-count">0</span></span>
            <button id="next-page">Volgende</button>
        </div>

        <canvas id="pdf-render"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
